    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d868d"/><stop offset="0.4" stop-color="#f1f3f4"/><stop offset="1" stop-color="#b9c1c7"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="316" height="196" rx="12" fill="#f4f7f2" stroke="#2e8b45" stroke-width="3"/>
  <!-- 1: straight line: pin on top, the wire passes over it -->
