  <path d="M8 26 L100 26" stroke="#2e8b45" stroke-width="3"/>
  <polygon points="100,20 110,26 100,32" fill="#2e8b45"/>
  <polygon points="16,20 6,26 16,32" fill="#2e8b45"/>
  <!-- 2: LT dead end: shackle on a D-iron, stay pulls back -->
  <rect x="156" y="40" width="8" height="140" fill="#b9bfc4"/>
  <line x1="158" y1="58" x2="114" y2="180" stroke="#4b5056" stroke-width="2"/>
