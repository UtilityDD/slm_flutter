  <text x="168" y="196" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e2228" text-anchor="middle">SHACKLE · LT</text>
  <text x="276" y="196" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e2228" text-anchor="middle">DISC · HT</text>
  <!-- a pin at a dead end: cracked under the pull -->
  <g transform="translate(206,110)">
