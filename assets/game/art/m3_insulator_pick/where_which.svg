  <polygon points="200,56 214,62 200,68" fill="#c0392b"/>
  <!-- 3: HT dead end: string of discs toward the pull -->
  <rect x="262" y="40" width="8" height="140" fill="#b9bfc4"/>
  <line x1="264" y1="60" x2="224" y2="180" stroke="#4b5056" stroke-width="2"/>
  <rect x="236" y="54" width="60" height="7" fill="#4e5a63"/>
  <line x1="270" y1="70" x2="316" y2="70" stroke="#6e777f" stroke-width="2.4"/>
