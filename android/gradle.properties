# Dev build speed only; none of this changes the app. 4 GB heap is plenty for this app's R8 pass
# and leaves room on a 16 GB laptop (the Flutter template's 8 GB + 4 GB metaspace is oversized).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Left off as before (only flutter_tts and MainActivity compile Kotlin, so it barely matters;
# a common reason to disable it is a pub cache on a different drive than the project on Windows).
kotlin.incremental=false
