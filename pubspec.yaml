name: slm_flutter
description: "SmartLineman: Bangla safety-training game for electricity linemen (Android)."
publish_to: 'none'
# Keep the name in step with AppConfig.appVersion (lib/core/config/app_config.dart).
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  google_sign_in: ^7.2.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  crypto: ^3.0.8
  flutter_svg: ^2.2.3
  lottie: ^3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    # The intro's wordmark only: Poppins ExtraBold (OFL, licenses/Poppins-OFL.txt),
    # subset to the letters of "SmartLineman".
    - family: PoppinsBrand
      fonts:
        - asset: assets/fonts/PoppinsBrand-ExtraBold.ttf
          weight: 800
  assets:
    - assets/sounds/quiz_right.wav
    - assets/sounds/quiz_wrong.wav
    - assets/sounds/quiz_shuffle.wav
    - assets/sounds/quiz_flip.wav
    - assets/sounds/quiz_select.wav
    - assets/sounds/quiz_complete.wav
    - assets/sounds/dress_right.wav
    - assets/sounds/dress_wrong.wav
    - assets/sounds/level_done.wav
    - assets/sounds/safe_home.wav
    - assets/sounds/clock_tick.wav
    - assets/sounds/accident.wav
    - assets/sounds/complaint.wav
    - assets/sounds/van_arrive.wav
    - assets/sounds/customer.wav
    - assets/sounds/intro/impact_metal.ogg
