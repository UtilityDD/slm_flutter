name: slm_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
  assets:
    - assets/sounds/quiz_right.wav
    - assets/sounds/quiz_wrong.wav
    - assets/sounds/quiz_shuffle.wav
    - assets/sounds/quiz_flip.wav
    - assets/sounds/quiz_select.wav
    - assets/sounds/quiz_complete.wav
    - assets/sounds/safe_home.wav
    - assets/sounds/clock_tick.wav
    - assets/sounds/accident.wav
    - assets/sounds/complaint.wav
    - assets/sounds/van_arrive.wav
    - assets/sounds/customer.wav
    - assets/sounds/voice/
    - assets/data/
    - assets/data/life_skill/
    - assets/lineman/
    - assets/zero_loss/crew/
    - assets/zero_loss/scene/
    - assets/quizzes/
    - assets/duty_slip/
    - assets/duty_slip/dress/
    - assets/safety/library/ab-cable-items/
    - assets/safety/library/charts/
    - assets/safety/library/insulators/
    - assets/safety/library/others/
    - assets/safety/library/ppe/
    - assets/safety/library/tools/
    - assets/safety/library/ug-cable/
