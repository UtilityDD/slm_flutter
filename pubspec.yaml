name: slm_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
  assets:
    - assets/data/
    - assets/safety/library/ab-cable-items/
    - assets/safety/library/charts/
    - assets/safety/library/insulators/
    - assets/safety/library/others/
    - assets/safety/library/ppe/
    - assets/safety/library/tools/
    - assets/safety/library/ug-cable/
